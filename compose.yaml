services:
  auth-db:
    image: postgres:18.6
    restart: on-failure:3
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "${AUTH_DB_PORT}:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  store-db:
    image: postgres:18.6
    restart: on-failure:3
    environment:
      POSTGRES_DB: ${STORE_DB_NAME}
      POSTGRES_USER: ${STORE_DB_USER}
      POSTGRES_PASSWORD: ${STORE_DB_PASSWORD}
    volumes:
      - store-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  catalog-db:
    image: postgres:18.6
    restart: on-failure:3
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME}
      POSTGRES_USER: ${CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
    volumes:
      - catalog-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    restart: on-failure:3
    environment:
      DB_URL: ${AUTH_DB_URL}
      DB_USER: ${AUTH_DB_USER}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE}
      AUTH_JWT_ACCESS_TOKEN_LIFETIME_SECONDS: ${AUTH_JWT_ACCESS_TOKEN_LIFETIME_SECONDS}
      AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE}
      STORE_SERVICE_URL: http://store-service:8080
      STORE_PROVISIONING_USERNAME: ${STORE_PROVISIONING_USERNAME}
      STORE_PROVISIONING_PASSWORD: ${STORE_PROVISIONING_PASSWORD}
    depends_on:
      auth-db:
        condition: service_healthy

  store-service:
    build:
      context: ./services/store-service
      dockerfile: Dockerfile
    restart: on-failure:3
    environment:
      DB_URL: ${STORE_DB_URL}
      DB_USER: ${STORE_DB_USER}
      DB_PASSWORD: ${STORE_DB_PASSWORD}
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE}
      STORE_PROVISIONING_USERNAME: ${STORE_PROVISIONING_USERNAME}
      STORE_PROVISIONING_PASSWORD: ${STORE_PROVISIONING_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:8080
    depends_on:
      store-db:
        condition: service_healthy
      auth-service:
        condition: service_started

  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    restart: on-failure:3
    environment:
      DB_URL: ${CATALOG_DB_URL}
      DB_USER: ${CATALOG_DB_USER}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE}
      STORE_SERVICE_URL: http://store-service:8080
    depends_on:
      catalog-db:
        condition: service_healthy
      store-service:
        condition: service_started

  admin-service:
    build:
      context: ./services/admin-service
      dockerfile: Dockerfile
    restart: on-failure:3
    environment:
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE}
      AUTH_SERVICE_BASE_URL: http://auth-service:8080
      STORE_SERVICE_BASE_URL: http://store-service:8080
      CATALOG_SERVICE_BASE_URL: http://catalog-service:8080
    depends_on:
      auth-service:
        condition: service_started
      store-service:
        condition: service_started
      catalog-service:
        condition: service_started

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    restart: on-failure:3
    environment:
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
    ports:
      - "${GATEWAY_PORT}:8080"
    depends_on:
      admin-service:
        condition: service_started
      store-service:
        condition: service_started
      catalog-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: on-failure:3
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next
    depends_on:
      gateway:
        condition: service_started

  jenkins:
    image: jenkins/jenkins:2.580.2-jdk25
    profiles: ["ci"]
    restart: on-failure:3
    environment:
      JENKINS_JAVA_OPTS: -Xms256m -Xmx1024m
    ports:
      - "127.0.0.1:${JENKINS_PORT}:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
    networks:
      - ci
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  jenkins-agent:
    image: jenkins/inbound-agent:3395.v6e5377b_0fb_3c-4-jdk25
    profiles: ["ci"]
    init: true
    restart: on-failure:3
    environment:
      JENKINS_URL: http://jenkins:8080
      JENKINS_AGENT_NAME: equipmenthub-agent
      # Set this after creating the node in Jenkins; start only jenkins first.
      JENKINS_SECRET: ${JENKINS_AGENT_SECRET}
      JENKINS_WEB_SOCKET: "true"
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
      JENKINS_JAVA_OPTS: -Xms64m -Xmx256m
      MAVEN_USER_HOME: /home/jenkins/agent/.m2
      MAVEN_OPTS: -Xmx512m -Dmaven.repo.local=/home/jenkins/agent/.m2/repository
    volumes:
      - jenkins-agent-work:/home/jenkins/agent
    networks:
      - ci
    depends_on:
      jenkins:
        condition: service_healthy
    mem_limit: 3g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ci:

volumes:
  auth-postgres-data:
  store-postgres-data:
  catalog-postgres-data:
  frontend-node-modules:
  frontend-next-cache:
  jenkins-home:
  jenkins-agent-work:
