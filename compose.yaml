services:
  kafka:
    image: apache/kafka:4.4.0
    restart: on-failure:3
    stop_grace_period: 60s
    environment:
      # Local single-node KRaft cluster; keep this ID with kafka-data.
      CLUSTER_ID: wMFxVRW6d0GTDvPCP2HZmQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms32m -Xmx128m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 6
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  auth-db:
    image: postgres:18.6
    restart: on-failure:3
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "${AUTH_DB_PORT}:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  store-db:
    image: postgres:18.6
    restart: on-failure:3
    environment:
      POSTGRES_DB: ${STORE_DB_NAME}
      POSTGRES_USER: ${STORE_DB_USER}
      POSTGRES_PASSWORD: ${STORE_DB_PASSWORD}
    volumes:
      - store-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  catalog-db:
    image: postgres:18.6
    restart: on-failure:3
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME}
      POSTGRES_USER: ${CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
    volumes:
      - catalog-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rental-db:
    image: postgres:18.6
    restart: on-failure:3
    environment:
      POSTGRES_DB: ${RENTAL_DB_NAME}
      POSTGRES_USER: ${RENTAL_DB_USER}
      POSTGRES_PASSWORD: ${RENTAL_DB_PASSWORD}
    volumes:
      - rental-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    restart: on-failure:3
    environment:
      DB_URL: ${AUTH_DB_URL}
      DB_USER: ${AUTH_DB_USER}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE}
      AUTH_JWT_ACCESS_TOKEN_LIFETIME_SECONDS: ${AUTH_JWT_ACCESS_TOKEN_LIFETIME_SECONDS}
      AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE}
      STORE_SERVICE_URL: http://store-service:8080
      STORE_PROVISIONING_USERNAME: ${STORE_PROVISIONING_USERNAME}
      STORE_PROVISIONING_PASSWORD: ${STORE_PROVISIONING_PASSWORD}
    depends_on:
      auth-db:
        condition: service_healthy

  store-service:
    build:
      context: ./services/store-service
      dockerfile: Dockerfile
    restart: on-failure:3
    environment:
      DB_URL: ${STORE_DB_URL}
      DB_USER: ${STORE_DB_USER}
      DB_PASSWORD: ${STORE_DB_PASSWORD}
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE}
      STORE_PROVISIONING_USERNAME: ${STORE_PROVISIONING_USERNAME}
      STORE_PROVISIONING_PASSWORD: ${STORE_PROVISIONING_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:8080
    depends_on:
      store-db:
        condition: service_healthy
      auth-service:
        condition: service_started

  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    restart: on-failure:3
    environment:
      DB_URL: ${CATALOG_DB_URL}
      DB_USER: ${CATALOG_DB_USER}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE}
      STORE_SERVICE_URL: http://store-service:8080
    depends_on:
      catalog-db:
        condition: service_healthy
      store-service:
        condition: service_started

  rental-service:
    build:
      context: ./services/rental-service
      dockerfile: Dockerfile
    restart: on-failure:3
    environment:
      DB_URL: ${RENTAL_DB_URL}
      DB_USER: ${RENTAL_DB_USER}
      DB_PASSWORD: ${RENTAL_DB_PASSWORD}
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE}
      STORE_SERVICE_URL: http://store-service:8080
      CATALOG_SERVICE_URL: http://catalog-service:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RENTAL_CONFIRMATION_CONSUMER_ENABLED: ${RENTAL_CONFIRMATION_CONSUMER_ENABLED:-true}
      RENTAL_CONFIRMATION_MAINTENANCE_ENABLED: ${RENTAL_CONFIRMATION_MAINTENANCE_ENABLED:-true}
    depends_on:
      rental-db:
        condition: service_healthy
      store-service:
        condition: service_started
      catalog-service:
        condition: service_started
      kafka:
        condition: service_healthy

  admin-service:
    build:
      context: ./services/admin-service
      dockerfile: Dockerfile
    restart: on-failure:3
    environment:
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE}
      AUTH_SERVICE_BASE_URL: http://auth-service:8080
      STORE_SERVICE_BASE_URL: http://store-service:8080
      CATALOG_SERVICE_BASE_URL: http://catalog-service:8080
    depends_on:
      auth-service:
        condition: service_started
      store-service:
        condition: service_started
      catalog-service:
        condition: service_started

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    restart: on-failure:3
    environment:
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
    ports:
      - "${GATEWAY_PORT}:8080"
    depends_on:
      admin-service:
        condition: service_started
      store-service:
        condition: service_started
      catalog-service:
        condition: service_started
      rental-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: on-failure:3
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${GATEWAY_PORT}
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - frontend-next-cache:/app/.next
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          initial_sync: true
          ignore:
            - package.json
            - package-lock.json
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
    depends_on:
      gateway:
        condition: service_started

  jenkins:
    image: jenkins/jenkins:2.580.2-jdk25
    profiles: ["ci"]
    restart: on-failure:3
    environment:
      JENKINS_JAVA_OPTS: -Xms256m -Xmx1024m
    ports:
      - "127.0.0.1:${JENKINS_PORT}:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
    networks:
      - ci
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  jenkins-agent:
    image: jenkins/inbound-agent:3395.v6e5377b_0fb_3c-4-jdk25
    profiles: ["ci"]
    init: true
    restart: on-failure:3
    environment:
      JENKINS_URL: http://jenkins:8080
      JENKINS_AGENT_NAME: equipmenthub-agent
      # Set this after creating the node in Jenkins; start only jenkins first.
      JENKINS_SECRET: ${JENKINS_AGENT_SECRET}
      JENKINS_WEB_SOCKET: "true"
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
      JENKINS_JAVA_OPTS: -Xms64m -Xmx256m
      MAVEN_USER_HOME: /home/jenkins/agent/.m2
      MAVEN_OPTS: -Xmx512m -Dmaven.repo.local=/home/jenkins/agent/.m2/repository
    volumes:
      - jenkins-agent-work:/home/jenkins/agent
    networks:
      - ci
    depends_on:
      jenkins:
        condition: service_healthy
    mem_limit: 3g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ci:

volumes:
  kafka-data:
  auth-postgres-data:
  store-postgres-data:
  catalog-postgres-data:
  rental-postgres-data:
  frontend-next-cache:
  jenkins-home:
  jenkins-agent-work:
