spring:
  application:
    name: auth-service
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s
      redirects: dont-follow
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
auth:
  bootstrap:
    platform-admin:
      email: ${PLATFORM_ADMIN_EMAIL:}
      password: ${PLATFORM_ADMIN_PASSWORD:}
  refresh-cookie:
    secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
  jwt:
    secret: ${AUTH_JWT_SECRET}
    issuer: ${AUTH_ISSUER_URI}
    audience: ${AUTH_JWT_AUDIENCE:equipmenthub-api}
    access-token-lifetime-seconds: ${AUTH_JWT_ACCESS_TOKEN_LIFETIME_SECONDS:600}
store:
  service:
    base-url: ${STORE_SERVICE_URL}
    username: ${STORE_PROVISIONING_USERNAME}
    password: ${STORE_PROVISIONING_PASSWORD}
server:
  servlet:
    context-path: /auth
