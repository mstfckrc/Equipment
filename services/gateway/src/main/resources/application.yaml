spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth
              uri: http://auth-service:8080
              predicates:
                - Path=/auth/**
              filters:
                - PreserveHostHeader
            - id: admin-service
              uri: http://admin-service:8080
              predicates:
                - Path=/api/admin/**
            - id: store-service
              uri: http://store-service:8080
              predicates:
                - Path=/api/stores/**
            - id: catalog-service
              uri: http://catalog-service:8080
              predicates:
                - Path=/api/catalog/**
            - id: rental-service
              uri: http://rental-service:8080
              predicates:
                - Path=/api/rentals/**
gateway:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    issuer: ${AUTH_ISSUER_URI}
    audience: ${AUTH_JWT_AUDIENCE:equipmenthub-api}
