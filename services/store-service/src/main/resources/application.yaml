spring:
  application:
    name: store-service
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s
      redirects: dont-follow
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    issuer: ${AUTH_ISSUER_URI}
    audience: ${AUTH_JWT_AUDIENCE}
  service:
    base-url: ${AUTH_SERVICE_URL}
store:
  service:
    auth-username: ${STORE_PROVISIONING_USERNAME}
    auth-password: ${STORE_PROVISIONING_PASSWORD}
